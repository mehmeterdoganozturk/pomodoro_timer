<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222330" />
      <stop offset="100%" stop-color="#12131A" />
    </linearGradient>

    <!-- Arc Glow Gradient -->
    <linearGradient id="arcGrad" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#FF7675" />
      <stop offset="100%" stop-color="#FF3838" />
    </linearGradient>

    <!-- Tomato / Leaf Accent -->
    <linearGradient id="leafGrad" x1="128" y1="80" x2="128" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ED573" />
      <stop offset="100%" stop-color="#10AC84" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="10" y="10" width="236" height="236" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="arcGlow" x="20" y="20" width="216" height="216" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF5252" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#333446" stroke-width="2" />

  <!-- Background Subtle Track -->
  <circle cx="128" cy="128" r="76" stroke="#2B2D3C" stroke-width="14" stroke-linecap="round" fill="none" />

  <!-- Progress Arc (75% completed) -->
  <circle cx="128" cy="128" r="76"
          stroke="url(#arcGrad)"
          stroke-width="14"
          stroke-linecap="round"
          stroke-dasharray="477.5"
          stroke-dashoffset="120"
          transform="rotate(-90 128 128)"
          filter="url(#arcGlow)"
          fill="none" />

  <!-- Center Icon: Sleek Stylized Tomato Leaf & Core -->
  <!-- Leaf Stem -->
  <path d="M128 88 C128 78 138 72 144 70 C140 78 136 84 133 88 Z" fill="url(#leafGrad)" />
  <path d="M124 90 C116 82 108 84 104 86 C112 90 118 92 122 93 Z" fill="url(#leafGrad)" />

  <!-- Core Hourglass / Clock Hands -->
  <circle cx="128" cy="132" r="32" fill="#1C1D26" stroke="#3D3F54" stroke-width="2.5" />
  <circle cx="128" cy="132" r="4.5" fill="#FF5252" />
  <!-- Clock hands at 25m position -->
  <line x1="128" y1="132" x2="128" y2="114" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="128" y1="132" x2="142" y2="139" stroke="#FF7675" stroke-width="2.5" stroke-linecap="round" />

  <!-- Head Dot on Arc -->
  <circle cx="128" cy="52" r="7" fill="#FFFFFF" filter="url(#arcGlow)" />
</svg>
